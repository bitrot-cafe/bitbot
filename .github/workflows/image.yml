# Build the production image and publish it to GitHub Container Registry.
#   Tag v1.2.3  -> ghcr.io/bitrot-cafe/bitbot:1.2.3, :1.2, :1, :latest (pin one of these in deployments)
#   Push master -> ghcr.io/bitrot-cafe/bitbot:edge, :sha-<short>      (testing only)
# Plugins aren't in the image; they're mounted at runtime.
name: image

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Tests run twice: SQLite (in memory) and this Postgres, including the SQLite ↔ Postgres copy test.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bitbot
          POSTGRES_PASSWORD: bitbot
          POSTGRES_DB: bitbot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bitbot" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: test (SQLite)
        run: pnpm test
      - name: test (Postgres)
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://bitbot:bitbot@localhost:5432/bitbot

  image:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Major-version tag (:0, :1, ...). metadata-action's {{major}} skips 0.x, so match it directly.
            type=match,pattern=^v(\d+)\.\d+\.\d+$,group=1
            # Releases only: a pre-release tag (v1.0.0-rc1) also matches v*.*.*, but mustn't move :latest.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: prod
          build-args: |
            BITBOT_VERSION=${{ steps.meta.outputs.version }}
            BITBOT_COMMIT=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
